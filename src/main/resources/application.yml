spring:
  datasource:
    url: ${PRINTLAB_DB_URL:jdbc:postgresql://localhost:5432/printlab_db}
    username: ${PRINTLAB_DB_USER:printlab_app}
    password: ${PRINTLAB_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10485760B
      max-request-size: 11534336B
printlab:
  upload-dir: ${PRINTLAB_UPLOAD_DIR:local/uploads}
