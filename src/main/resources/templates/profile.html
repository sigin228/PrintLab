<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Личный кабинет</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main><h1>Личный кабинет</h1><p th:if="${param.saved}">Профиль сохранён.</p><form th:action="@{/profile}" th:object="${profileUpdateRequest}" method="post"><label>ФИО <input th:field="*{fullName}" maxlength="120"></label><p class="error" th:errors="*{fullName}"></p><label>Телефон <input th:field="*{phone}" maxlength="30"></label><p class="error" th:errors="*{phone}"></p><label>Адрес доставки <textarea th:field="*{deliveryAddress}" maxlength="2000"></textarea></label><p class="error" th:errors="*{deliveryAddress}"></p><button>Сохранить</button></form></main><div th:replace="~{fragments :: footer}"></div></body></html>
