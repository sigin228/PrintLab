<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><body><span class="order-status" th:fragment="status(value)" th:switch="${value}"><span th:case="'AWAITING_PAYMENT'">Ожидает оплаты</span><span th:case="'PAID_SIMULATED'">Оплачен (демо)</span><span th:case="'IN_PRODUCTION'">В производстве</span><span th:case="'READY'">Готов</span><span th:case="'COMPLETED'">Завершён</span><span th:case="'CANCELLED'">Отменён</span><span th:case="*" th:text="${value}">Статус</span></span></body></html>
