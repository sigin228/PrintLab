<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Товар — PRINTLAB</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><a class="skip-link" href="#main">Перейти к содержимому</a><div th:replace="~{fragments :: header}"></div><main id="main" class="container product-main"><a class="back-link" href="/catalog"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-left"></use></svg> Назад в каталог</a><div class="product-layout"><div class="product-image product-detail-image"><span aria-hidden="true">Изображение отсутствует</span><img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}" th:src="${product.imageUrl}" th:alt="|Фото: ${product.name}|" onerror="this.style.display='none'"></div><section class="product-details"><p>Демонстрационный товар: цена и остаток приведены для примера.</p><p class="eyebrow" th:text="${product.category == 'TSHIRT' ? 'Футболки' : (product.category == 'HOODIE' ? 'Худи' : (product.category == 'SWEATSHIRT' ? 'Свитшоты' : product.category))}">Категория</p><h1 th:text="${product.name}">Название товара</h1><p class="detail-price"><span>БАЗОВАЯ ЦЕНА</span><strong th:text="|${product.basePriceKzt} ₸|">0 ₸</strong></p><p class="product-description" th:if="${product.description != null and !#strings.isEmpty(product.description)}" th:text="${product.description}">Описание</p><div class="variant-heading"><h2>Варианты</h2><span>РАЗМЕР / ЦВЕТ / ЦЕНА</span></div><p class="empty-variants" th:if="${#lists.isEmpty(product.variants)}">Доступных вариантов пока нет.</p><ul class="variant-list" th:unless="${#lists.isEmpty(product.variants)}"><li th:each="variant : ${product.variants}"><div><strong th:text="|${variant.size} / ${variant.color == 'Black' ? 'Чёрный' : (variant.color == 'White' ? 'Белый' : (variant.color == 'Grey' ? 'Серый' : (variant.color == 'Beige' ? 'Бежевый' : variant.color)))}|">M / Чёрный</strong><span class="variant-sku" th:text="|Артикул: ${variant.sku}|"></span></div><div class="variant-right"><strong th:text="|${variant.price} ₸|">0 ₸</strong><span th:if="${variant.stockQuantity > 0}" th:text="|В наличии: ${variant.stockQuantity} шт.|">В наличии</span><span class="out-of-stock" th:unless="${variant.stockQuantity > 0}">Нет в наличии</span></div></li></ul><form class="product-designer-form" th:action="@{/designer/{id}(id=${product.id})}" method="get"><label for="designer-variant">Выберите размер и цвет</label><select id="designer-variant" name="variantId" required><option value="">Выберите вариант</option><option th:each="variant : ${product.variants}" th:value="${variant.id}" th:disabled="${variant.stockQuantity == 0}" th:text="|${variant.size} / ${variant.color} — ${variant.stockQuantity > 0 ? variant.price + ' ₸' : 'нет в наличии'}|">Размер и цвет</option></select><button class="button button-accent editor-wide" type="submit" th:disabled="${#lists.isEmpty(product.variants)}">Создать дизайн <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-up-right"></use></svg></button></form></section></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
