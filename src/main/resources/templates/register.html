<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Регистрация</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main><h1>Регистрация</h1><form th:action="@{/register}" th:object="${registerRequest}" method="post"><label>Email <input type="email" th:field="*{email}" required></label><p class="error" th:errors="*{email}"></p><label>Пароль <input type="password" name="password" autocomplete="new-password" required></label><p class="error" th:errors="*{password}"></p><label>Повторите пароль <input type="password" name="confirmPassword" autocomplete="new-password" required></label><p class="error" th:errors="*{confirmPassword}"></p><button>Зарегистрироваться</button></form><a href="/login">Уже есть аккаунт? Войти</a></main><div th:replace="~{fragments :: footer}"></div></body></html>
