<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Мои заказы — PRINTLAB</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><a class="skip-link" href="#main">Перейти к содержимому</a><div th:replace="~{fragments :: header}"></div><main id="main" class="container commerce-main"><a class="back-link" href="/profile"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-left"></use></svg> Личный кабинет</a><p class="eyebrow"><span class="dot"></span> PRINTLAB / АККАУНТ</p><h1>МОИ ЗАКАЗЫ<span class="accent-text">.</span></h1><section class="empty-state" th:if="${#lists.isEmpty(orders)}"><span aria-hidden="true">✳</span><h2>У вас пока нет заказов</h2><p>Начните с выбора вещи в каталоге.</p><a class="button button-outline" href="/catalog">Перейти в каталог <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-up-right"></use></svg></a></section><div class="order-list" th:unless="${#lists.isEmpty(orders)}"><article class="order-row" th:each="order : ${orders}"><div><span class="commerce-caption">ЗАКАЗ</span><h2 th:text="|№ ${order.id}|"></h2></div><div><span class="commerce-caption">ДАТА / UTC</span><time th:text="${order.createdAt}"></time></div><div><span class="commerce-caption">СТАТУС</span><span th:replace="~{commerce-fragments :: status(${order.status})}"></span></div><div><span class="commerce-caption">СУММА</span><strong th:text="|${order.totalKzt} ₸|"></strong></div><a class="button button-outline" th:href="@{/orders/{id}(id=${order.id})}" th:aria-label="|Подробнее о заказе № ${order.id}|">Подробнее <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-up-right"></use></svg></a></article></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
