<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товары — Управление PrintLab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><a class="skip-link" href="#admin-main">Перейти к содержимому</a><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar}"></aside><main id="admin-main" class="admin-main"><div th:replace="~{admin/fragments :: notices}"></div><div class="admin-heading"><div><p class="eyebrow"><span class="dot"></span> УПРАВЛЕНИЕ / КАТАЛОГ</p><h1>Товары</h1><p>Активные вещи видны покупателям в каталоге.</p></div><a class="button button-accent" href="/admin/products/new">Добавить товар <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-up-right"></use></svg></a></div><section class="admin-panel"><p th:if="${#lists.isEmpty(products)}" class="commerce-copy">Товаров пока нет.</p><div class="admin-record admin-product-record" th:each="product : ${products}"><div><strong th:text="${product.name}"></strong><small th:text="|ID ${product.id} / ${product.category}|"></small></div><span th:text="${product.active ? 'Активен' : 'Скрыт'}"></span><strong th:text="|${product.base_price_kzt} ₸|"></strong><a th:href="@{/admin/products/{id}(id=${product.id})}" th:aria-label="|Редактировать товар ${product.name}|">Изменить <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-up-right"></use></svg></a></div></section></main></div></body></html>
