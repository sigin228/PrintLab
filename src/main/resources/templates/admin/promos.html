<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Промокоды — PrintLab</title><link rel="stylesheet" href="/css/style.css"></head><body><a class="skip-link" href="#admin-main">Перейти к содержимому</a><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar}"></aside><main id="admin-main" class="admin-main"><div th:replace="~{admin/fragments :: notices}"></div><div class="admin-heading"><div><p class="eyebrow">PRINTLAB / УПРАВЛЕНИЕ</p><h1>Промокоды</h1><p>Скидка проверяется и рассчитывается сервером при оформлении заказа.</p></div></div><section class="admin-panel"><h2>Создать промокод</h2><form th:action="@{/admin/promos/create}" method="post"><div class="admin-fields"><div class="field"><label for="code">Код</label><input id="code" name="code" required maxlength="60" pattern="[A-Za-z0-9_-]{2,60}"></div><div class="field"><label for="type">Тип скидки</label><select id="type" name="type"><option value="PERCENT">Процент</option><option value="FIXED">Сумма в ₸</option></select></div><div class="field"><label for="value">Значение</label><input id="value" name="value" type="number" min="1" max="1000000000" required></div><div class="field"><label for="minimum">Минимальная сумма, ₸</label><input id="minimum" name="minimum" type="number" min="0" max="1000000000" value="0" required></div><div class="field"><label for="limit">Лимит использований</label><input id="limit" name="limit" type="number" min="1" max="1000000" placeholder="Без лимита"></div></div><button type="submit" class="button button-dark">Создать промокод <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-up-right"></use></svg></button></form></section><section class="admin-panel"><h2>Существующие промокоды</h2><p th:if="${#lists.isEmpty(promos)}">Промокодов пока нет.</p><article class="admin-variant" th:each="p : ${promos}"><p><strong th:text="${p.code}"></strong> <span th:text="${p.active ? 'Активен' : 'Отключён'}"></span></p><p th:text="|${p.discount_type == 'PERCENT' ? 'Процент' : 'Скидка в ₸'}: ${p.discount_value} · Минимум: ${p.min_order_kzt} ₸|"></p><p th:text="${p.usage_limit == null ? 'Без лимита' : 'Лимит: ' + p.usage_limit}"></p><form th:action="@{/admin/promos/{id}/active(id=${p.id})}" method="post"><input type="hidden" name="active" th:value="${!p.active}"><button class="button button-outline" type="submit" th:text="${p.active ? 'Отключить' : 'Включить'}"></button></form></article></section></main></div></body></html>
