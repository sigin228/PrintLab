<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Принты — Управление PrintLab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><a class="skip-link" href="#admin-main">Перейти к содержимому</a><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar}"></aside><main id="admin-main" class="admin-main"><div th:replace="~{admin/fragments :: notices}"></div><div class="admin-heading"><div><p class="eyebrow"><span class="dot"></span> УПРАВЛЕНИЕ / СТУДИЯ</p><h1>Принты</h1><p>Добавляйте готовые изображения для конструктора.</p></div></div><div class="admin-form-layout"><section class="admin-panel"><h2>Добавить принт</h2><p class="commerce-copy">PNG или JPEG до 10 МБ. Используйте изображения, на которые у вас есть права.</p><form th:action="@{/admin/prints}" method="post" enctype="multipart/form-data"><div class="field"><label for="name">Название</label><input id="name" name="name" maxlength="100" required></div><div class="field"><label for="file">Изображение PNG или JPEG</label><input id="file" name="file" type="file" accept="image/png,image/jpeg" required></div><button class="button button-dark" type="submit">Добавить принт ↗</button></form></section><section class="admin-panel"><h2>Принты магазина</h2><p class="commerce-copy">Скрытые принты останутся в сохранённых дизайнах и заказах.</p><p class="commerce-copy" th:if="${#lists.isEmpty(prints)}">Принтов пока нет.</p><article class="admin-print-row" th:each="print : ${prints}"><img th:src="@{/admin-prints/{id}/image(id=${print.id})}" alt=""><div><strong th:text="${print.name}"></strong><p th:text="${print.active ? 'Активен' : 'Скрыт'}"></p></div><form th:if="${print.active}" th:action="@{/admin/prints/{id}/disable(id=${print.id})}" method="post"><button class="button button-outline" type="submit" th:aria-label="|Скрыть принт ${print.name}|"><span>Скрыть</span></button></form></article></section></div></main></div></body></html>
