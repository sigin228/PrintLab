<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обзор — Управление PrintLab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><a class="skip-link" href="#admin-main">Перейти к содержимому</a><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar}"></aside><main id="admin-main" class="admin-main"><div th:replace="~{admin/fragments :: notices}"></div><div class="admin-heading"><div><p class="eyebrow"><span class="dot"></span> PRINTLAB / УПРАВЛЕНИЕ</p><h1>Обзор</h1><p>Реальные показатели магазина и демонстрационных платежей.</p></div></div><section class="admin-stats" aria-label="Показатели"><article><span>Всего заказов</span><strong th:text="${stats.orders}">0</strong></article><article><span>Ожидают оплаты</span><strong th:text="${stats.newOrders}">0</strong></article><article><span>Оплачено (демо)</span><strong th:text="${stats.paidOrders}">0</strong></article><article><span>В производстве</span><strong th:text="${stats.production}">0</strong></article><article><span>Завершено</span><strong th:text="${stats.completed}">0</strong></article><article><span>Пользователи</span><strong th:text="${stats.users}">0</strong></article><article><span>Активные товары</span><strong th:text="${stats.products}">0</strong></article><article><span>Демо-выручка</span><strong th:text="|${stats.revenue} ₸|">0 ₸</strong></article></section><section class="admin-panel"><div class="admin-section-heading"><h2>Последние заказы</h2><a href="/admin/orders">Все заказы ↗</a></div><p class="commerce-copy" th:if="${#lists.isEmpty(recentOrders)}">Заказов пока нет.</p><div class="admin-record" th:each="order : ${recentOrders}"><div><strong th:text="|Заказ № ${order.id}|"></strong><small th:text="${order.email}"></small></div><span th:replace="~{admin/fragments :: status(${order.status})}"></span><strong th:text="|${order.total_kzt} ₸|"></strong><a th:href="@{/admin/orders/{id}(id=${order.id})}" th:aria-label="|Открыть заказ № ${order.id}|">Открыть ↗</a></div></section></main></div></body></html>
