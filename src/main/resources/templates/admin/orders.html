<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заказы — Управление PrintLab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><a class="skip-link" href="#admin-main">Перейти к содержимому</a><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar}"></aside><main id="admin-main" class="admin-main"><div th:replace="~{admin/fragments :: notices}"></div><div class="admin-heading"><div><p class="eyebrow"><span class="dot"></span> УПРАВЛЕНИЕ / ЗАКАЗЫ</p><h1>Заказы</h1><p>Поиск по номеру и фильтр по состоянию.</p></div></div><form action="/admin/orders" method="get" class="admin-panel admin-filter"><div class="field"><label for="search">Номер заказа</label><input id="search" name="search" type="text" inputmode="numeric" pattern="[0-9]{1,18}" maxlength="18" th:value="${search}" placeholder="Например, 12"></div><div class="field"><label for="status">Статус</label><select id="status" name="status"><option value="">Все статусы</option><option value="AWAITING_PAYMENT" th:selected="${status == 'AWAITING_PAYMENT'}">Ожидает оплаты</option><option value="PAID_SIMULATED" th:selected="${status == 'PAID_SIMULATED'}">Оплачен (демо)</option><option value="IN_PRODUCTION" th:selected="${status == 'IN_PRODUCTION'}">В производстве</option><option value="READY" th:selected="${status == 'READY'}">Готов</option><option value="COMPLETED" th:selected="${status == 'COMPLETED'}">Завершён</option><option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Отменён</option></select></div><button class="button button-dark" type="submit">Найти <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-up-right"></use></svg></button><a class="admin-reset" href="/admin/orders">Сбросить</a></form><section class="admin-panel"><p class="commerce-copy" th:if="${#lists.isEmpty(orders)}">Заказы не найдены. <a href="/admin/orders">Сбросить фильтр</a></p><div class="admin-record admin-order-record" th:each="order : ${orders}"><div><strong th:text="|Заказ № ${order.id}|"></strong><small th:text="${order.email}"></small></div><time th:text="${order.created_at}"></time><span th:replace="~{admin/fragments :: status(${order.status})}"></span><strong th:text="|${order.total_kzt} ₸|"></strong><a th:href="@{/admin/orders/{id}(id=${order.id})}" th:aria-label="|Открыть заказ № ${order.id}|">Открыть <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons/sprite.svg#arrow-up-right"></use></svg></a></div></section></main></div></body></html>
