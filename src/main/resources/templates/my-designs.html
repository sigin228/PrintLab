<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title>Мои дизайны — PRINTLAB</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><a class="skip-link" href="#main">Перейти к содержимому</a><div th:replace="~{fragments :: header}"></div><main id="main" class="container designs-main"><div class="designs-heading"><div><p class="eyebrow"><span class="dot"></span> PRINTLAB / СТУДИЯ</p><h1>МОИ ДИЗАЙНЫ<span class="accent-text">.</span></h1><p>Идеи, которые можно продолжить в любое время.</p></div><a href="/catalog" class="button button-dark">Создать дизайн ↗</a></div><p id="design-list-status" class="editor-message" role="status"></p><section class="empty-state" th:if="${#lists.isEmpty(designs)}"><span aria-hidden="true">✳</span><h2>Пока нет дизайнов</h2><p>Выберите вещь в каталоге и создайте свой первый дизайн.</p><a class="button button-outline" href="/catalog">Перейти в каталог ↗</a></section><div class="saved-design-grid" th:unless="${#lists.isEmpty(designs)}"><article class="saved-design" th:each="design : ${designs}" th:attr="data-design-id=${design.id},data-design-title=${design.title}"><div class="saved-design-image" aria-hidden="true"><span>✳</span><small>PRINTLAB / ДИЗАЙН</small></div><div class="saved-design-info"><p class="eyebrow">СОХРАНЁННЫЙ ДИЗАЙН</p><h2 th:text="${design.title}">Мой дизайн</h2><p class="saved-design-date" th:text="|Изменён: ${#temporals.format(design.updatedAt, 'dd.MM.yyyy')}|">Изменён</p><div class="saved-design-actions"><a class="button button-outline" th:href="@{/designer/{productId}(productId=${design.productId},variantId=${design.variantId},designId=${design.id})}">Открыть ↗</a><button type="button" class="design-remove" th:aria-label="|Удалить дизайн ${design.title}|">Удалить</button></div></div></article></div></main><script src="/js/design-editor.js" defer></script><div th:replace="~{fragments :: footer}"></div></body></html>
