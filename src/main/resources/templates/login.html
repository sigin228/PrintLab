<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Вход</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main><h1>Вход</h1><p th:if="${param.registered}">Регистрация завершена. Войдите в аккаунт.</p><p class="error" th:if="${param.error}">Неверный логин, email или пароль.</p><form th:action="@{/login}" method="post"><label>Логин или email <input type="text" name="username" required></label><label>Пароль <input type="password" name="password" required></label><button>Войти</button></form><a href="/register">Регистрация</a></main><div th:replace="~{fragments :: footer}"></div></body></html>
